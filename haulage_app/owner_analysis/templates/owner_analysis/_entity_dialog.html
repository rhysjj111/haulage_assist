<dialog class="owner-entity-dialog" id="owner-entity-dialog" aria-labelledby="owner-entity-dialog-title">
  <div class="owner-entity-dialog-header">
    <h2 id="owner-entity-dialog-title">Details</h2>
    <button type="button" class="owner-button owner-button-secondary owner-entity-dialog-close" autofocus>Close</button>
  </div>
  <div class="owner-entity-dialog-body" aria-live="polite" aria-busy="false"></div>
</dialog>
<script>
(function () {
  'use strict';
  var dialog = document.getElementById('owner-entity-dialog');
  if (!dialog || typeof dialog.showModal !== 'function' || !window.fetch || !window.AbortController) return;
  var body = dialog.querySelector('.owner-entity-dialog-body');
  var title = document.getElementById('owner-entity-dialog-title');
  var opener = null;
  var controller = null;
  var version = 0;

  function cancelRequest() {
    version += 1;
    if (controller) controller.abort();
    controller = null;
  }

  function showFailure(url) {
    body.replaceChildren();
    var message = document.createElement('p');
    message.textContent = 'The summary could not be loaded. You can open the details page or close this window and try again.';
    var link = document.createElement('a');
    link.href = url;
    link.className = 'owner-button owner-button-secondary';
    link.textContent = 'Open details page';
    body.append(message, link);
  }

  dialog.querySelector('.owner-entity-dialog-close').addEventListener('click', function () { dialog.close(); });
  dialog.addEventListener('close', function () {
    cancelRequest();
    body.setAttribute('aria-busy', 'false');
    body.replaceChildren();
    if (opener && opener.isConnected) opener.focus();
    opener = null;
  });

  document.addEventListener('click', function (event) {
    var link = event.target.closest('a[data-owner-entity-details-link]');
    if (!link || event.defaultPrevented || event.button !== 0 || event.metaKey || event.ctrlKey || event.shiftKey || event.altKey) return;
    var url = new URL(link.href, window.location.href);
    if (url.origin !== window.location.origin) return;
    event.preventDefault();
    cancelRequest();
    var currentVersion = version;
    opener = link;
    title.textContent = link.getAttribute('data-entity-label') || 'Details';
    body.textContent = 'Loading summary…';
    body.setAttribute('aria-busy', 'true');
    body.scrollTop = 0;
    if (!dialog.open) dialog.showModal();
    controller = new AbortController();
    var requestController = controller;
    fetch(url.href, {
      method: 'GET',
      credentials: 'same-origin',
      cache: 'no-store',
      headers: {'X-Requested-With': 'XMLHttpRequest'},
      signal: requestController.signal
    }).then(function (response) {
      if (!response.ok) throw new Error('Summary request failed');
      return response.text();
    }).then(function (html) {
      if (version !== currentVersion || !dialog.open) return;
      var template = document.createElement('template');
      template.innerHTML = html;
      var details = template.content.querySelector('[data-owner-entity-details]');
      if (!details) throw new Error('Summary response was incomplete');
      body.replaceChildren(details);
    }).catch(function (error) {
      if (error.name !== 'AbortError' && version === currentVersion && dialog.open) showFailure(url.href);
    }).finally(function () {
      if (version === currentVersion) {
        controller = null;
        body.setAttribute('aria-busy', 'false');
      }
    });
  });
}());
</script>
